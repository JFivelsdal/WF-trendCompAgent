<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workflow | WF-trendCompAgent</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="viewer">
<div class="topbar">
  <a class="back" href="index.html">&larr; All workflows</a>
  <h1 id="title">Loading…</h1>
  <div class="actions">
    <a class="btn" id="outLink" href="#" hidden>See the output</a>
    <button class="btn" id="copyBtn" type="button" hidden>Copy for n8n</button>
    <a class="btn" id="dlLink" href="#" download hidden>Download JSON</a>
  </div>
</div>

<div class="wf-body">
  <div class="canvas" id="canvas">
    <div id="svgHost" class="svg-host"></div>
    <div class="legend" id="legend"></div>
    <div class="zoom">
      <button type="button" id="zin" aria-label="Zoom in">+</button>
      <button type="button" id="zout" aria-label="Zoom out">&minus;</button>
      <button type="button" id="zfit" aria-label="Fit to screen" title="Fit to screen">&#9635;</button>
    </div>
  </div>
  <aside class="panel" id="panel"><p class="hint">Loading workflow…</p></aside>
</div>

<script src="data.js"></script>
<script src="workflow-render.js"></script>
<script>
const item = HUB.find(new URLSearchParams(location.search).get('id'));
const $ = id => document.getElementById(id);
const SECRET = /(api[-_ ]?key|token|secret|password|authorization|bearer)/i;
let wf = null, view = null, home = null;

function fail(msg) { $('title').textContent = 'Workflow not available'; $('svgHost').innerHTML = '<p class="error"></p>'; $('svgHost').firstChild.textContent = msg; $('panel').innerHTML = ''; }

if (!item || !HUB.workflows.includes(item)) {
  fail('That workflow is not in the list. Go back to the hub and pick one.');
} else {
  document.title = item.title + ' | WF-trendCompAgent';
  $('title').textContent = item.title;
  $('dlLink').href = item.file; $('dlLink').hidden = false;
  if (item.related && HUB.find(item.related)) { $('outLink').href = 'report.html?id=' + encodeURIComponent(item.related); $('outLink').hidden = false; }
  fetch(item.file).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
    .then(txt => { wf = JSON.parse(txt); init(txt); })
    .catch(e => fail('Could not load ' + item.file + ' (' + e.message + '). If you opened this page by double-clicking the file, run a local server instead: python -m http.server'));
}

function init(rawText) {
  const out = WFRender.build(wf);
  $('svgHost').innerHTML = out.svg;
  const svg = $('svgHost').firstChild;
  svg.setAttribute('width', '100%'); svg.setAttribute('height', '100%');
  home = out.viewBox; view = Object.assign({}, home);
  $('legend').innerHTML = out.categoriesUsed.map(c => '<span><i style="background:' + WFRender.COLORS[c] + '"></i>' + WFRender.LABELS[c] + '</span>').join('');
  fitView();
  showSummary(out);

  $('copyBtn').hidden = false;
  $('copyBtn').onclick = () => navigator.clipboard.writeText(rawText).then(() => { $('copyBtn').textContent = 'Copied. Paste into n8n'; setTimeout(() => $('copyBtn').textContent = 'Copy for n8n', 2500); });

  // select a node
  const canvas = $('canvas');
  const pick = el => {
    const g = el.closest && el.closest('.node'); if (!g) return;
    canvas.querySelectorAll('.node.selected').forEach(n => n.classList.remove('selected'));
    g.classList.add('selected');
    showNode(g.dataset.name);
  };
  canvas.addEventListener('click', e => { if (!moved) pick(e.target); });
  canvas.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(e.target); } });

  // pan + zoom
  let drag = null, moved = false;
  const scale = () => Math.min(canvas.clientWidth / view.w, canvas.clientHeight / view.h);
  canvas.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y }; moved = false; });
  window.addEventListener('pointermove', e => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (Math.abs(dx) + Math.abs(dy) > 4) { moved = true; canvas.classList.add('dragging'); }
    const s = scale(); view.x = drag.vx - dx / s; view.y = drag.vy - dy / s; setView();
  });
  window.addEventListener('pointerup', () => { drag = null; canvas.classList.remove('dragging'); setTimeout(() => moved = false, 0); });
  canvas.addEventListener('wheel', e => { e.preventDefault(); zoomAt(e.deltaY < 0 ? 1.15 : 1 / 1.15, e.clientX, e.clientY); }, { passive: false });
  $('zin').onclick = () => zoomAt(1.3); $('zout').onclick = () => zoomAt(1 / 1.3); $('zfit').onclick = fitView;
  window.addEventListener('resize', setView);
}

function setView() { $('svgHost').firstChild.setAttribute('viewBox', [view.x, view.y, view.w, view.h].join(' ')); }
function zoomAt(f, cx, cy) {
  const r = $('canvas').getBoundingClientRect(), s = Math.min(r.width / view.w, r.height / view.h);
  // keep the point under the cursor (or the centre) fixed
  const px = (cx === undefined ? r.left + r.width / 2 : cx), py = (cy === undefined ? r.top + r.height / 2 : cy);
  const ox = (r.width - view.w * s) / 2, oy = (r.height - view.h * s) / 2;
  const wx = view.x + (px - r.left - ox) / s, wy = view.y + (py - r.top - oy) / s;
  view.w /= f; view.h /= f;
  const s2 = Math.min(r.width / view.w, r.height / view.h), ox2 = (r.width - view.w * s2) / 2, oy2 = (r.height - view.h * s2) / 2;
  view.x = wx - (px - r.left - ox2) / s2; view.y = wy - (py - r.top - oy2) / s2; setView();
}
function fitView() {
  const r = $('canvas').getBoundingClientRect();
  const fit = Math.min(r.width / home.w, r.height / home.h);
  view = Object.assign({}, home);
  if (fit < 0.45) {            // very wide flows: start at a readable size on the left instead of a tiny full view
    const s = 0.8; view.w = r.width / s; view.h = r.height / s; view.y = home.y + home.h / 2 - view.h / 2;
  }
  setView();
}

function el(tag, text, cls) { const e = document.createElement(tag); if (text !== undefined) e.textContent = text; if (cls) e.className = cls; return e; }
function redact(v, key) {
  if (SECRET.test(key || '') && typeof v === 'string' && v) return '••• hidden •••';
  if (Array.isArray(v)) return v.map(x => redact(x, key));
  if (v && typeof v === 'object') { const o = {}; Object.keys(v).forEach(k => o[k] = redact(v[k], k)); return o; }
  if (typeof v === 'string' && /^(sk-|Bearer\s)/.test(v)) return '••• hidden •••';
  return v;
}
function showSummary(out) {
  const p = $('panel'); p.innerHTML = '';
  p.appendChild(el('h2', item.title));
  p.appendChild(el('p', item.description, 'type'));
  const stats = el('div', undefined, 'stats');
  stats.appendChild(el('span', out.count + ' nodes', 'stat'));
  const conns = Object.values(wf.connections || {}).reduce((n, o) => n + Object.values(o).reduce((m, a) => m + a.reduce((k, x) => k + (x || []).length, 0), 0), 0);
  stats.appendChild(el('span', conns + ' connections', 'stat'));
  p.appendChild(stats);
  p.appendChild(el('p', 'Click any node to see its settings and code. Drag to move around, scroll to zoom.', 'hint'));
}
function showNode(name) {
  const n = (wf.nodes || []).find(x => x.name === name); if (!n) return;
  const p = $('panel'); p.innerHTML = '';
  p.appendChild(el('h2', n.name));
  p.appendChild(el('p', n.type + (n.typeVersion ? '  v' + n.typeVersion : ''), 'type'));
  if (n.notes) { p.appendChild(el('h4', 'Notes')); p.appendChild(el('p', n.notes, 'hint')); }
  const params = redact(n.parameters || {});
  Object.keys(params).forEach(k => {
    const v = params[k];
    p.appendChild(el('h4', k));
    let text = typeof v === 'string' ? v : JSON.stringify(v, null, 2);
    if (text.length > 20000) text = text.slice(0, 20000) + '\n… (shortened. Download the JSON for the full text)';
    p.appendChild(el('pre', text));
  });
  if (!Object.keys(params).length) p.appendChild(el('p', 'No settings on this node.', 'hint'));
  const back = el('button', 'Back to overview', 'tab'); back.style.marginTop = '1rem'; back.onclick = () => { $('canvas').querySelectorAll('.node.selected').forEach(x => x.classList.remove('selected')); showSummary(WFRender.build(wf)); };
  p.appendChild(back);
}
</script>
</body>
</html>
